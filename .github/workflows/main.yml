name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Haris El Net APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Unzip project
        run: |
          mkdir -p project
          for z in *.zip; do
            unzip -q -o "$z" -d project
          done

      - name: Find Gradle project
        id: loc
        run: |
          f=$(find project -name "settings.gradle*" | head -1)
          echo "settings file: $f"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Force minSdk 26
        run: |
          f=$(find project -name "build.gradle.kts" -path "*app*" | head -1)
          sed -i -E 's/minSdk *= *[0-9]+/minSdk = 26/' "$f"
          grep -n "minSdk" "$f"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "========== ERRORS =========="
            grep -E "^e: |What went wrong|Could not|Unresolved|error:" -A3 build.log | head -60
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: HarisElNet-Debug-APK
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Haris El Net Android App
          files: "project/**/build/outputs/apk/debug/*.apk"
